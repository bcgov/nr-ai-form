[project]
name = "nr-ai-form-evaluation"
version = "0.1.0"
description = "Evaluation suite (Promptfoo + DeepEval quality + PyRIT red-team) for the nr-ai-form water permit assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "deepeval>=1.4.0",
    "openai>=1.99.0",
    "azure-identity>=1.19.0",
    "httpx>=0.25.0",
    "openpyxl>=3.1.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pyyaml>=6.0",
]
# PyRIT red-team engine (heavier deps; install with: pip install -e ".[redteam]")
redteam = [
    "pyrit>=0.14.0",
    "structlog>=25.4.0",
    "aiohttp>=3.9.0",
    "click>=8.1.0,<8.4.0",
]

[tool.pytest.ini_options]
testpaths = ["deepeval"]
addopts = "-v"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared", "redteam"]
