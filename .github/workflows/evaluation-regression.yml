name: Evaluation regression

on:
  pull_request:
    paths:
      - "evaluation/**"
      - ".github/workflows/evaluation-regression.yml"
  push:
    paths:
      - "evaluation/**"
      - ".github/workflows/evaluation-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-regression:
    runs-on: ubuntu-24.04
    env:
      DEEPEVAL_TELEMETRY_OPT_OUT: "YES"
      PROMPTFOO_DISABLE_TELEMETRY: "1"
      PROMPTFOO_DISABLE_UPDATE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install evaluation dependencies
        run: python -m pip install "./evaluation[dev,redteam]"
      - name: Run offline transport and scoring regressions
        run: python -m pytest evaluation/tests
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: evaluation/promptfoo/package-lock.json
      - name: Install Promptfoo
        working-directory: evaluation/promptfoo
        run: npm ci
      - name: Verify the exact pass-rate threshold without model calls
        working-directory: evaluation/promptfoo
        run: npm test
