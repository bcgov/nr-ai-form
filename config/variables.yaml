# Environment Variables Configuration - Single Source of Truth
# This file is the authoritative definition of all environment variables used across:
# - GitHub Actions Workflow (.github/workflows/.deployer_aca.yml)
# - Terragrunt Configuration (terragrunt/terragrunt.hcl)
# - Terraform Variables (infra/variables.tf, infra/modules/container-apps/variables.tf)
# - Agent Service .env files (orchestrators, conversationagent, formsupportagent, api_backend)
#
# See scripts/generate-configs.py to auto-generate all downstream files from this definition.

variables:
  # ============================================================================
  # Azure OpenAI Configuration
  # ============================================================================
  - name: AZURE_OPENAI_API_KEY
    category: "Azure OpenAI"
    type: "secret"
    description: "API key for Azure OpenAI service"
    source: "GitHub secrets"
    targets: ["github-actions", "terragrunt", "terraform-root", "terraform-module", "agent-env"]
    terraform_type: "string"
    terraform_sensitive: true
    terraform_default: '""'
    agent_targets: ["orchestrator", "conversation", "formsupport", "api_backend"]

  - name: AZURE_OPENAI_ENDPOINT
    category: "Azure OpenAI"
    type: "variable"
    description: "Endpoint URL for Azure OpenAI service"
    source: "GitHub vars"
    targets: ["github-actions", "terragrunt", "terraform-root", "terraform-module", "agent-env"]
    terraform_type: "string"
    terraform_default: '""'
    agent_targets: ["orchestrator", "conversation", "formsupport"]

  - name: AZURE_OPENAI_API_VERSION
    category: "Azure OpenAI"
    type: "variable"
    description: "API version for Azure OpenAI"
    source: "GitHub vars"
    targets: ["github-actions", "terragrunt", "terraform-root", "terraform-module", "agent-env"]
    terraform_type: "string"
    terraform_default: '""'
    agent_targets: ["orchestrator", "conversation", "formsupport"]

  - name: AZURE_OPENAI_CHAT_DEPLOYMENT_NAME
    category: "Azure OpenAI"
    type: "variable"
    description: "Deployment name for chat completions model"
    source: "GitHub vars"
    targets: ["github-actions", "terragrunt", "terraform-root", "terraform-module", "agent-env"]
    terraform_type: "string"
    terraform_default: '""'
    agent_targets: ["orchestrator", "conversation", "formsupport"]

  # ============================================================================
  # Azure Search Configuration
  # ============================================================================
  - name: AZURE_SEARCH_ENDPOINT
    category: "Azure Search"
    type: "variable"
    description: "Endpoint URL for Azure Search service"
    source: "GitHub vars"
    targets: ["github-actions", "terragrunt", "terraform-root", "terraform-module", "agent-env"]
    terraform_type: "string"
    terraform_default: '""'
    agent_targets: ["conversation"]

  - name: AZURE_SEARCH_API_KEY
    category: "Azure Search"
    type: "secret"
    description: "API key for Azure Search service"
    source: "GitHub secrets"
    targets: ["github-actions", "terragrunt", "terraform-root", "terraform-module", "agent-env"]
    terraform_type: "string"
    terraform_sensitive: true
    terraform_default: '""'
    agent_targets: ["conversation"]

  - name: AZURE_SEARCH_INDEX_NAME
    category: "Azure Search"
    type: "variable"
    description: "Index name in Azure Search"
    source: "GitHub vars"
    targets: ["github-actions", "terragrunt", "terraform-root", "terraform-module", "agent-env"]
    terraform_type: "string"
    terraform_default: '""'
    agent_targets: ["conversation"]

  # ============================================================================
  # Azure Document Intelligence Configuration
  # ============================================================================
  - name: AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT
    category: "Azure Document Intelligence"
    type: "variable"
    description: "Endpoint URL for Azure Document Intelligence"
    source: "GitHub vars"
    targets: ["github-actions", "terragrunt", "terraform-root", "terraform-module"]
    terraform_type: "string"
    terraform_default: '""'

  - name: AZURE_DOCUMENT_INTELLIGENCE_KEY
    category: "Azure Document Intelligence"
    type: "secret"
    description: "API key for Azure Document Intelligence"
    source: "GitHub secrets"
    targets: ["github-actions", "terragrunt", "terraform-root", "terraform-module"]
    terraform_type: "string"
    terraform_sensitive: true
    terraform_default: '""'

  # ============================================================================
  # Azure Storage Configuration
  # ============================================================================
  - name: AZURE_STORAGE_ACCOUNT_NAME
    category: "Azure Storage"
    type: "variable"
    description: "Name of Azure Storage account"
    source: "GitHub vars"
    targets: ["github-actions", "terragrunt", "terraform-root", "terraform-module"]
    terraform_type: "string"
    terraform_default: '""'

  - name: AZURE_STORAGE_ACCOUNT_KEY
    category: "Azure Storage"
    type: "secret"
    description: "Access key for Azure Storage account"
    source: "GitHub secrets"
    targets: ["github-actions", "terragrunt", "terraform-root", "terraform-module"]
    terraform_type: "string"
    terraform_sensitive: true
    terraform_default: '""'

  - name: AZURE_STORAGE_CONTAINER_NAME
    category: "Azure Storage"
    type: "variable"
    description: "Container name in Azure Storage"
    source: "GitHub vars"
    targets: ["github-actions", "terragrunt", "terraform-root", "terraform-module"]
    terraform_type: "string"
    terraform_default: '""'

  # ============================================================================
  # Azure Blob Storage Configuration
  # ============================================================================
  - name: AZURE_BLOBSTORAGE_CONNECTIONSTRING
    category: "Azure Blob Storage"
    type: "variable"
    description: "Connection string for Azure Blob Storage"
    source: "GitHub vars"
    targets: ["github-actions", "terragrunt", "terraform-root", "terraform-module", "agent-env"]
    terraform_type: "string"
    terraform_default: '""'
    agent_default: ""
    agent_targets: ["orchestrator", "conversation", "formsupport"]

  - name: AZURE_BLOBSTORAGE_CONTAINER
    category: "Azure Blob Storage"
    type: "variable"
    description: "Container name in Azure Blob Storage for assets"
    source: "GitHub vars"
    targets: ["github-actions", "terragrunt", "terraform-root", "terraform-module", "agent-env"]
    terraform_type: "string"
    terraform_default: '""'
    agent_default: "assets"
    agent_targets: ["orchestrator", "conversation", "formsupport"]

  # ============================================================================
  # Azure Cosmos DB Configuration
  # ============================================================================
  - name: AZURE_COSMOS_DB_ENDPOINT
    category: "Azure Cosmos DB"
    type: "variable"
    description: "Azure Cosmos DB endpoint URL"
    source: "GitHub vars"
    targets: ["github-actions", "terragrunt", "terraform-root", "terraform-module", "agent-env"]
    terraform_type: "string"
    terraform_default: '""'
    agent_default: ""
    agent_targets: ["api_backend"]

  - name: AZURE_COSMOS_DB_KEY
    category: "Azure Cosmos DB"
    type: "secret"
    description: "Azure Cosmos DB read access key"
    source: "GitHub secrets"
    targets: ["github-actions", "terragrunt", "terraform-root", "terraform-module", "agent-env"]
    terraform_type: "string"
    terraform_sensitive: true
    terraform_default: '""'
    agent_default: ""
    agent_targets: ["api_backend"]

  - name: AZURE_COSMOS_DB_DATABASE_NAME
    category: "Azure Cosmos DB"
    type: "variable"
    description: "Azure Cosmos DB database name"
    source: "GitHub vars"
    targets: ["github-actions", "terragrunt", "terraform-root", "terraform-module", "agent-env"]
    terraform_type: "string"
    terraform_default: '"AgentMemoryDB"'
    agent_default: "AgentMemoryDB"
    agent_targets: ["api_backend"]

  # ============================================================================
  # Tenant Profile Configuration
  # ============================================================================
  - name: TENANT_PROFILE_FRESH_TTL_SECONDS
    category: "Tenant Profile"
    type: "variable"
    description: "TTL in seconds for fresh tenant profile cache"
    source: "GitHub vars"
    targets: ["github-actions", "terragrunt", "terraform-root", "terraform-module", "agent-env"]
    terraform_type: "string"
    terraform_default: '"300"'
    agent_default: "300"
    agent_targets: ["api_backend"]

  - name: TENANT_PROFILE_STALE_TTL_SECONDS
    category: "Tenant Profile"
    type: "variable"
    description: "TTL in seconds for stale tenant profile cache"
    source: "GitHub vars"
    targets: ["github-actions", "terragrunt", "terraform-root", "terraform-module", "agent-env"]
    terraform_type: "string"
    terraform_default: '"86400"'
    agent_default: "86400"
    agent_targets: ["api_backend"]

  - name: TENANT_PROFILE_LOOKUP_TIMEOUT_SECONDS
    category: "Tenant Profile"
    type: "variable"
    description: "Timeout in seconds for tenant profile lookup"
    source: "GitHub vars"
    targets: ["github-actions", "terragrunt", "terraform-root", "terraform-module", "agent-env"]
    terraform_type: "string"
    terraform_default: '"0.5"'
    agent_default: "0.5"
    agent_targets: ["api_backend"]

  # ============================================================================
  # Cache Configuration
  # ============================================================================
  - name: ORCHESTRATOR_PROMPT_CACHE_TTL_SECONDS
    category: "Cache"
    type: "variable"
    description: "TTL in seconds for orchestrator prompt cache"
    source: "GitHub vars"
    targets: ["github-actions", "terragrunt", "terraform-root", "terraform-module", "agent-env"]
    terraform_type: "string"
    terraform_default: '"300"'
    agent_default: "300"
    agent_targets: ["orchestrator"]

  - name: CONVERSATION_PROMPT_CACHE_TTL_SECONDS
    category: "Cache"
    type: "variable"
    description: "TTL in seconds for conversation prompt cache"
    source: "GitHub vars"
    targets: ["github-actions", "terragrunt", "terraform-root", "terraform-module", "agent-env"]
    terraform_type: "string"
    terraform_default: '"300"'
    agent_default: "300"
    agent_targets: ["conversation"]

  - name: FORM_SUPPORT_AGENT_CACHE_TTL_SECONDS
    category: "Cache"
    type: "variable"
    description: "TTL in seconds for form support agent cache"
    source: "GitHub vars"
    targets: ["github-actions", "terragrunt", "terraform-root", "terraform-module", "agent-env"]
    terraform_type: "string"
    terraform_default: '"300"'
    agent_default: "300"
    agent_targets: ["formsupport"]

  - name: FORM_SUPPORT_PROMPT_CACHE_TTL_SECONDS
    category: "Cache"
    type: "variable"
    description: "TTL in seconds for form support prompt cache"
    source: "GitHub vars"
    targets: ["github-actions", "terragrunt", "terraform-root", "terraform-module", "agent-env"]
    terraform_type: "string"
    terraform_default: '"300"'
    agent_default: "300"
    agent_targets: ["formsupport"]

  - name: FORM_SUPPORT_ASSET_CACHE_TTL_SECONDS
    category: "Cache"
    type: "variable"
    description: "TTL in seconds for form support asset cache"
    source: "GitHub vars"
    targets: ["github-actions", "terragrunt", "terraform-root", "terraform-module", "agent-env"]
    terraform_type: "string"
    terraform_default: '"300"'
    agent_default: "300"
    agent_targets: ["formsupport"]

  # ============================================================================
  # Redis Configuration
  # ============================================================================
  - name: REDIS_HOST
    category: "Redis"
    type: "variable"
    description: "Redis cache host"
    source: "GitHub vars"
    targets: ["github-actions", "terragrunt", "terraform-root", "terraform-module", "agent-env"]
    terraform_type: "string"
    terraform_default: '""'
    agent_targets: ["orchestrator", "api_backend"]

  - name: REDIS_PORT
    category: "Redis"
    type: "variable"
    description: "Redis cache port"
    source: "GitHub vars"
    targets: ["github-actions", "terragrunt", "terraform-root", "terraform-module", "agent-env"]
    terraform_type: "number"
    terraform_default: '10000'
    agent_targets: ["orchestrator", "api_backend"]

  - name: REDIS_PASSWORD
    category: "Redis"
    type: "secret"
    description: "Redis cache access key"
    source: "GitHub secrets"
    targets: ["github-actions", "terragrunt", "terraform-root", "terraform-module", "agent-env"]
    terraform_type: "string"
    terraform_sensitive: true
    terraform_default: '""'
    agent_targets: ["orchestrator", "api_backend"]

  - name: REDIS_SSL
    category: "Redis"
    type: "variable"
    description: "Enable SSL for Redis connection"
    source: "GitHub vars"
    targets: ["github-actions", "terragrunt", "terraform-root", "terraform-module", "agent-env"]
    terraform_type: "bool"
    terraform_default: 'false'
    agent_targets: ["orchestrator", "api_backend"]

  - name: REDIS_TTL_DAYS
    category: "Redis"
    type: "variable"
    description: "TTL in days for Redis entries"
    source: "GitHub vars"
    targets: ["github-actions", "terragrunt", "terraform-root", "terraform-module", "agent-env"]
    terraform_type: "number"
    terraform_default: '14'
    agent_targets: ["orchestrator", "api_backend"]

  # ============================================================================
  # CORS Configuration
  # ============================================================================
  - name: CORS_ALLOW_ORIGINS
    category: "CORS"
    type: "variable"
    description: "Comma-separated list of allowed origins for CORS"
    source: "GitHub vars"
    targets: ["github-actions", "terragrunt", "terraform-root", "terraform-module"]
    terraform_type: "string"
    terraform_default: '""'

  # ============================================================================
  # Application Insights
  # ============================================================================
  - name: APPLICATIONINSIGHTS_CONNECTION_STRING
    category: "Application Insights"
    type: "secret"
    description: "Connection string for Application Insights"
    source: "GitHub secrets"
    targets: ["github-actions", "terragrunt", "terraform-root", "terraform-module", "agent-env"]
    terraform_type: "string"
    terraform_sensitive: true
    terraform_default: '""'
    agent_targets: ["orchestrator", "conversation", "formsupport"]

  - name: APPINSIGHTS_INSTRUMENTATIONKEY
    category: "Application Insights"
    type: "secret"
    description: "Instrumentation key for Application Insights"
    source: "GitHub secrets"
    targets: ["github-actions", "terragrunt", "terraform-root", "terraform-module", "agent-env"]
    terraform_type: "string"
    terraform_sensitive: true
    terraform_default: '""'
    agent_targets: ["orchestrator", "conversation", "formsupport"]

  # ============================================================================
  # Agent Service Routing Configuration
  # ============================================================================
  - name: CONVERSATION_AGENT_A2A_URL
    category: "Agent Routing"
    type: "variable"
    description: "URL for Conversation Agent A2A service"
    source: "GitHub vars"
    targets: ["github-actions", "terragrunt", "terraform-root", "terraform-module", "agent-env"]
    terraform_type: "string"
    terraform_default: '"http://localhost:8000"'
    agent_default: "http://localhost:8000"
    agent_targets: ["orchestrator"]

  - name: FORM_SUPPORT_AGENT_A2A_URL
    category: "Agent Routing"
    type: "variable"
    description: "URL for Form Support Agent A2A service"
    source: "GitHub vars"
    targets: ["github-actions", "terragrunt", "terraform-root", "terraform-module", "agent-env"]
    terraform_type: "string"
    terraform_default: '"http://localhost:8001"'
    agent_default: "http://localhost:8001"
    agent_targets: ["orchestrator"]

  - name: ORCHESTRATOR_AGENT_WS_URL
    category: "Agent Routing"
    type: "variable"
    description: "WebSocket URL for Orchestrator Agent service"
    source: "GitHub vars"
    targets: ["github-actions", "terragrunt", "terraform-root", "terraform-module", "agent-env"]
    terraform_type: "string"
    terraform_default: '"ws://localhost:8002/ws"'
    agent_default: "ws://localhost:8002/ws"
    agent_targets: ["api_backend"]
  
  - name: TEST_URL
    category: "Agent Routing"
    type: "variable"
    description: "TEST URL"
    source: "GitHub vars"
    targets: ["github-actions", "terragrunt", "terraform-root", "terraform-module", "agent-env"]
    terraform_type: "string"
    terraform_default: '"TEST"'
    agent_default: "TEST"
    agent_targets: ["api_backend"]
